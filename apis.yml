apis:
- aid: one-concern-domino-ai-api
  name: One Concern Domino AI API
  description: >-
    The Domino AI API returns One Concern's location-based physical-risk analytics for a
    single latitude/longitude. Five POST operations cover business-interruption risk scores
    by return period, by average annual downtime and by planning horizon, and property-damage
    ratios by return period and by average annual downtime. Every request selects a peril
    (flood, wind, seismic, integrated), a climate-change scenario (ccbaseline or cc2050_45),
    and for business interruption an interruption type (integrated, utility, ingress_egress,
    community, repair_time, ports, airports, bridges, highways). Responses carry the One
    Concern building id, the mean and standard deviation of downtime in days (or the damage
    ratio and its standard deviation) and a low/med/high risk label. Authentication is a
    customer-issued API token in the x-1c-api-token header plus a required client-id header
    used for billing attribution; an optional transaction-id header supports per-call
    tracing. Version provenance is returned on every response as x-1c-api-version and
    x-1c-data-version.
  humanURL: https://developer.oneconcern.com/overview
  baseURL: https://api.oneconcern.com
