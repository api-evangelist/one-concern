aid: one-concern
name: One Concern
description: >-
  One Concern is a Palo Alto, California climate-resilience analytics company that builds a
  digital twin of the built environment to quantify physical climate and natural-catastrophe
  risk in units of time rather than broad-brush hazard bands. Its Domino AI platform models
  the recovery of an individual building together with the lifelines it depends on — power
  distribution, ports, airports, roads and bridges, the surrounding residential community —
  and returns business-interruption downtime statistics, property-damage ratios and a 1CRX
  resilience score for a given latitude and longitude, per peril (flood, tropical-cyclone
  wind, seismic ground shaking, or all perils integrated), per return period or planning
  horizon, and under baseline or 2050 climate-change scenarios. The company sells to
  insurers, reinsurers, financial services and real estate, and exposes the platform to
  customers through the Domino AI API, a five-operation REST contract documented at
  developer.oneconcern.com and served from api.oneconcern.com behind a Tyk gateway with a
  customer-issued x-1c-api-token header.
