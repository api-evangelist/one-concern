description: >-
  No first-party client library for the One Concern Domino AI API was found in any public
  package registry. The developer portal documents the API as plain REST over HTTPS with a
  header-based token and publishes no SDK, no quickstart snippet library, and no package
  install instructions. The company's GitHub org is public and verified but contains
  infrastructure forks and research/hazard-model code, not an API client.
