    meaning: released version of the API code returning the metrics
  - header: x-1c-data-version
    format: vUS.X.Y.Z
    meaning: version of the dataset the API consumed to create the metrics
  policy_quote: >-
    "Developers should expect that most backwards compatible changes to the API contract or
    metrics will result in no change to the API endpoints, instead simply resulting in a change
    to the x-1c-api-version returned in the header. Similarly, most data updates will not result
    in changes to the endpoints, just a change to the x-1c-data-version returned in the header."
  model_change_communication: >-
    "Generally, when significant improvements are made from a modeling point of view, customers
    will be notified of this through the customer success team." Model changes are therefore
    announced privately, not published.
  audit_guidance: >-
    One Concern explicitly recommends that customers record the returned version headers "for use
    cases that require an audit trail of data used in their applications." For a regulated
    insurance or capital-markets consumer this is the reproducibility contract.
