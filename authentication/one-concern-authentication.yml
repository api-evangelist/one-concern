  gateway: 'x-generator: tyk.io'
  note: >-
    An undocumented path on the same host returns 404, so the 401 confirms both that
    api.oneconcern.com is the real base URL for this contract and that the documented auth
    model is enforced at the gateway.
gaps:
- The OpenAPI declares no securitySchemes, so a generated client or an agent reading only the
  spec cannot discover that x-1c-api-token is required. Adding an apiKey scheme and a global
  security requirement would be a one-line fix with a large agent-readability payoff.
- No documented token rotation, expiry, or revocation procedure.
- No self-service credential path; every integration begins with a sales conversation.
