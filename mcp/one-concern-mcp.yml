agent_notes:
- Every tool is read-only. There is no write surface, so no confirmation or reversal step is needed.
- >-
  A 204 No Content is a legitimate answer meaning the location is outside modeled coverage. A
  tool wrapper must translate it into a structured "no data" result rather than an error.
- >-
  peril accepts `integrated` on the average-annual and planning-horizon tools but NOT on the
  return-period tools. A single shared enum in a tool wrapper would produce 422s.
- >-
  Every call requires a client-id header. A server implementation must accept it as
  configuration, not per-call input.
